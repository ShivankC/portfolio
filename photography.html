  <!--
    Speckle/stipple texture, sitting behind the whole page (z-index:
    -1, see the style block below) — small dark flecks, not
    continuous grain. Purely decorative (aria-hidden, pointer-events:
    none — it can never intercept a click or a hover).

    Deliberately NOT given its own transition:name. That was tried —
    the intent was to keep it from flickering through the default
    root fade on navigation, since it's identical on every page — but
    it backfired: a named element gets captured as an independent
    snapshot layer that the browser composites on top of everything
    else while a transition is active, ignoring this element's own
    z-index for that whole window. The visible symptom was exactly
    "the specks show up, then vanish fast right after the page
    settles" — briefly on top of everything during the transition,
    then correctly hidden behind opaque content again once it ends.
    Leaving it unnamed means it's just baked into the default root
    snapshot like ordinary content, which already has the correct
    z-order baked into its pixels — no separate overlay, no flicker.
  -->
  <div class="fleck-overlay" aria-hidden="true" data-astro-cid-z4jru4n3></div>

  and adds the class .visible when they scroll into view,
  which triggers the CSS transition defined in global.css.

				const el = entry.target;
				[el, ...el.children].forEach((node) => {
					if (!(node instanceof HTMLElement)) return;
					node.style.willChange = "transform, opacity";
					node.addEventListener("transitionend", function clearWillChange(e) {
						if (e.target !== node) return;
						if (node.getAnimations().length > 0) return;
						node.style.willChange = "";
						node.removeEventListener("transitionend", clearWillChange);
					});
				});
				el.classList.add("visible");
				observer.unobserve(el);
			}
		});
	}, {
		threshold: .08,
		rootMargin: "0px 0px -40px 0px"
	});
	document.querySelectorAll(".fade-in, .stagger-children").forEach((el) => {
		observer.observe(el);
	});
}
initScrollAnimations();
document.addEventListener("astro:page-load", initScrollAnimations);
function navOrder() {
	return Array.from(document.querySelectorAll(".nav-link")).map((a) => new URL(a.href).pathname);
}
function indexOfPath(order, pathname) {
	return order.findIndex((p) => pathname === p || p !== "/" && pathname.startsWith(p));
}
document.addEventListener("astro:before-preparation", (event) => {
	const root = document.documentElement;
	const e = event;
	const order = navOrder();
	const fromIdx = indexOfPath(order, e.from?.pathname ?? "");
	const toIdx = indexOfPath(order, e.to?.pathname ?? "");
	if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) {
		root.removeAttribute("data-astro-reel");
		root.removeAttribute("data-astro-reel-jumps");
		return;
	}
	root.setAttribute("data-astro-reel", toIdx > fromIdx ? "up" : "down");
	const jumps = Math.min(4, Math.abs(toIdx - fromIdx));
	root.setAttribute("data-astro-reel-jumps", String(jumps));
});

<script type="module">//#region src/pages/photography.astro?astro&type=script&index=0&lang.ts
function setupLightbox() {
	const scrim = document.getElementById("lbScrim");
	const modal = document.getElementById("lbModal");
	const img = document.getElementById("lbImg");
	const desc = document.getElementById("lbDesc");
	const counter = document.getElementById("lbCounter");
	const closeBtn = document.getElementById("lbClose");
	const prevBtn = document.getElementById("lbPrev");
	const nextBtn = document.getElementById("lbNext");
	const tiles = Array.from(document.querySelectorAll(".photo-tile"));
	if (!(scrim && modal && img instanceof HTMLImageElement && desc && counter && closeBtn && prevBtn && nextBtn) || tiles.length === 0) return;
	const total = tiles.length;
	let current = 0;
	function render() {
		const tile = tiles[current];
		const tileImg = tile.querySelector("img");
		if (tileImg instanceof HTMLImageElement) {
			img.src = tileImg.src;
			img.alt = tileImg.alt;
		}
		desc.textContent = tile.dataset.desc || "";
		desc.hidden = !tile.dataset.desc;
		counter.textContent = `${current + 1} / ${total}`;
	}
	function open(index) {
		current = index;
		render();
		scrim.hidden = false;
		modal.hidden = false;
		requestAnimationFrame(() => {
			scrim.classList.add("is-open");
			modal.classList.add("is-open");
		});
		document.documentElement.style.overflow = "hidden";
		document.addEventListener("keydown", onKeydown);
	}
	function close() {
		scrim.classList.remove("is-open");
		modal.classList.remove("is-open");
		document.documentElement.style.overflow = "";
		document.removeEventListener("keydown", onKeydown);
		window.setTimeout(() => {
			scrim.hidden = true;
			modal.hidden = true;
		}, 260);
	}
	function next() {
		current = (current + 1) % total;
		render();
	}
	function prev() {
		current = (current - 1 + total) % total;
		render();
	}
	function onKeydown(e) {
		if (e.key === "Escape") close();
		else if (e.key === "ArrowRight") next();
		else if (e.key === "ArrowLeft") prev();
	}
	tiles.forEach((tile, i) => {
		tile.addEventListener("click", () => open(i));
	});
	closeBtn.addEventListener("click", close);
	prevBtn.addEventListener("click", prev);
	nextBtn.addEventListener("click", next);
	scrim.addEventListener("click", close);
	modal.addEventListener("click", (e) => {
		if (e.target === modal) close();
	});
}
setupLightbox();
document.addEventListener("astro:page-load", setupLightbox);
//#endregion</script>
