    -1, see the style block below) — small dark flecks, not
    continuous grain. Purely decorative (aria-hidden, pointer-events:
    none — it can never intercept a click or a hover).

    Deliberately NOT given its own transition:name. That was tried —
    the intent was to keep it from flickering through the default
    root fade on navigation, since it's identical on every page — but
    it backfired: a named element gets captured as an independent
    snapshot layer that the browser composites on top of everything
    else while a transition is active, ignoring this element's own
    z-index for that whole window. The visible symptom was exactly
    "the specks show up, then vanish fast right after the page
    settles" — briefly on top of everything during the transition,
    then correctly hidden behind opaque content again once it ends.
    Leaving it unnamed means it's just baked into the default root
    snapshot like ordinary content, which already has the correct
    z-order baked into its pixels — no separate overlay, no flicker.
  -->
  <div class="fleck-overlay" aria-hidden="true" data-astro-cid-z4jru4n3></div>

<!--
  SCROLL FADE-IN SCRIPT
  This runs in the browser (not during build time).
  It watches for elements with .fade-in or .stagger-children
  and adds the class .visible when they scroll into view,
  which triggers the CSS transition defined in global.css.
-->
<script type="module">//#region src/layouts/BaseLayout.astro?astro&type=script&index=0&lang.ts
function initScrollAnimations() {
	const observer = new IntersectionObserver((entries) => {
		entries.forEach((entry) => {
			if (entry.isIntersecting) {
				const el = entry.target;
				[el, ...el.children].forEach((node) => {
					if (!(node instanceof HTMLElement)) return;
					node.style.willChange = "transform, opacity";
					node.addEventListener("transitionend", function clearWillChange(e) {
						if (e.target !== node) return;
						if (node.getAnimations().length > 0) return;
						node.style.willChange = "";
						node.removeEventListener("transitionend", clearWillChange);
					});
				});
				el.classList.add("visible");
				observer.unobserve(el);
			}
		});
	}, {
		threshold: .08,
		rootMargin: "0px 0px -40px 0px"
	});
	document.querySelectorAll(".fade-in, .stagger-children").forEach((el) => {
		observer.observe(el);
	});
}
initScrollAnimations();
document.addEventListener("astro:page-load", initScrollAnimations);
function navOrder() {
	return Array.from(document.querySelectorAll(".nav-link")).map((a) => new URL(a.href).pathname);
}
function indexOfPath(order, pathname) {
	return order.findIndex((p) => pathname === p || p !== "/" && pathname.startsWith(p));
}
document.addEventListener("astro:before-preparation", (event) => {
	const root = document.documentElement;
	const e = event;
	const order = navOrder();
	const fromIdx = indexOfPath(order, e.from?.pathname ?? "");
	const toIdx = indexOfPath(order, e.to?.pathname ?? "");
	if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) {
		root.removeAttribute("data-astro-reel");
		root.removeAttribute("data-astro-reel-jumps");
		return;
	}
	root.setAttribute("data-astro-reel", toIdx > fromIdx ? "up" : "down");
	const jumps = Math.min(4, Math.abs(toIdx - fromIdx));
	root.setAttribute("data-astro-reel-jumps", String(jumps));
});
//#endregion</script>

ery language. Picking up other languages later got a lot easier once those core concepts had actually stuck.","built":["Nothing dedicated — just the practice problems and exercises built into the course itself."]},{"image":"certifications/Intro-to-AI-JA-Singapore-IBM-SkillsBuild.png","issuer":"JA Singapore & IBM SkillsBuild","program":"JA/IBM Intro to AI","date":null,"verify":null,"project":null,"takeaway":"A foundational overview of AI, covering machine learning basics and the different categories of AI systems, hosted by Junior Achievement Singapore at school.","built":["Nothing — this one ended with a digital credential rather than any kind of project."]},{"image":"certifications/Pre-Collegiate-Summer-Institutes-Acceptance-Letter-Stanford.png","issuer":"Stanford Pre-Collegiate Studies","program":"Pre-Collegiate Summer Institutes — Introduction to Medicine","date":"Admitted Apr 2026","verify":null,"project":null,"takeaway":"Each session ran two hours, the first spent going deep on a disease that's either notoriously hard to treat or still not fully understood. The second hour always brought in a guest speaker, ranging from PhD and MD students all the way up to heads of research at MIT and Stanford, plus practicing pharmacologists.","built":["I leaned on my developing interest in photography and created an image meant to show exactly how someone with Charles Bonnet Syndrome, a visual disorder, actually perceives the world."]},{"image":"certifications/Introduction-to-Engineering-Biological-Systems-IIT-Madras.jpg","issuer":"IIT Madras","program":"Introduction to Engineering Biological Systems","date":"Completed Oct 2025 · 8 weeks","verify":null,"project":null,"takeaway":"Took this through a school connect program with IIT Madras, and picked it mostly because \"Introduction to Engineering Biological Systems\" sounded cool. Expected something closer to prosthetics, got an entire course on producing things like insulin using bacteria in industrial fermenters instead. Still ended up learning a genuine amount about industrial methods and growing bacteria at scale.","built":["For the final project, I ran a germination experiment across different conditions and tracked the results over two weeks. Passed with a distinction."]}];

  function initCertPanels() {
    document.documentElement.style.overflow = '';

    const scrim = document.getElementById('certScrim');
    const wrap = document.getElementById('certWrap');
    const flip = document.getElementById('certFlip');
    const panel = document.getElementById('certPanel');
    if (!scrim || !wrap || !flip || !panel) return;

    const closeBtn = document.getElementById('certClose');
    const imgEl = document.getElementById('certImg');
    const issuerEl = document.getElementById('certIssuer');
    const programEl = document.getElementById('certProgram');
    const dateEl = document.getElementById('certDate');
    const takeawayEl = document.getElementById('certTakeaway');
    const builtListEl = document.getElementById('certBuiltList');
    const linksEl = document.getElementById('certLinks');
    const verifyLink = document.getElementById('certVerifyLink');
    const projectLink = document.getElementById('certProjectLink');
    if (!(closeBtn && imgEl instanceof HTMLImageElement && issuerEl && programEl && dateEl
      && takeawayEl && builtListEl && linksEl && verifyLink && projectLink)) return;

    let activeCard = null;
    let currentAnim = null;

    const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function flipEase() {
      const v = getComputedStyle(document.documentElement).getPropertyValue('--ease-out').trim();
      return v || 'cubic-bezier(0.16, 1, 0.3, 1)';
    }

    function buildKeyframes(cardRect, flipRect) {
      const dx = (cardRect.left + cardRect.width / 2) - (flipRect.left + flipRect.width / 2);
      const dy = (cardRect.top + cardRect.height / 2) - (flipRect.top + flipRect.height / 2);
      const sx = cardRect.width / flipRect.width;
      const sy = cardRect.height / flipRect.height;
      const spin = (dx < 0 ? 1 : -1) * 720;
      const from = `translate(${dx}px, ${dy}px) scale(${sx}, ${sy}) rotateY(${spin}deg)`;
      const to = `translate(0px, 0px) scale(1, 1) rotateY(0deg)`;
      return [{ transform: from }, { transform: to }];
    }

    function openPanel(card) {
      if (!(card instanceof HTMLElement) || flip.classList.contains('is-open')) return;
      activeCard = card;

      const data = certs[Number(card.dataset.index)];
      if (!data) return;

      imgEl.src = data.image;
      imgEl.alt = `${data.program} certificate`;
      issuerEl.textContent = data.issuer;
      programEl.textContent = data.program;
      if (data.date) { dateEl.textContent = data.date; dateEl.hidden = false; }
      else { dateEl.textContent = ''; dateEl.hidden = true; }
      takeawayEl.textContent = data.takeaway;

      builtListEl.innerHTML = '';
      data.built.forEach((item) => {
        const li = document.createElement('li');
        li.textContent = item;
        builtListEl.appendChild(li);
      });

      const hasVerify = Boolean(data.verify);
      const hasProject = Boolean(data.project);
      verifyLink.hidden = !hasVerify;
      if (hasVerify) verifyLink.href = data.verify;
      projectLink.hidden = !hasProject;
      if (hasProject) projectLink.href = data.project;
      linksEl.hidden = !hasVerify && !hasProject;

      document.documentElement.style.overflow = 'hidden';
      scrim.hidden = false;
      wrap.hidden = false;
      requestAnimationFrame(() => scrim.classList.add('is-open'));

      if (reduceMotion()) {
        requestAnimationFrame(() => flip.classList.add('is-open'));
      } else {
        flip.classList.add('is-open');
        const cardRect = card.getBoundingClientRect();
        const flipRect = flip.getBoundingClientRect();
        if (currentAnim) currentAnim.cancel();
        currentAnim = flip.animate(buildKeyframes(cardRect, flipRect), {
          duration: 640,
          easing: flipEase(),
          fill: 'both',
        });
      }

      panel.setAttribute('aria-hidden', 'false');
      closeBtn.focus();
      document.addEventListener('keydown', onKeydown);
    }

    function closePanel() {
      if (!flip.classList.contains('is-open')) return;
      const card = activeCard;

      document.documentElement.style.overflow = '';
      scrim.classList.remove('is-open');
      panel.setAttribute('aria-hidden', 'true');
      document.removeEventListener('keydown', onKeydown);

      const finish = () => {
        flip.classList.remove('is-open');
        wrap.hidden = true;
        scrim.hidden = true;
        if (card) card.focus();
        activeCard = null;
      };

      if (!reduceMotion() && card) {
        const cardRect = card.getBoundingClientRect();
        const flipRect = flip.getBoundingClientRect();
        if (currentAnim) currentAnim.cancel();
        currentAnim = flip.animate(buildKeyframes(cardRect, flipRect), {
          duration: 560,
          easing: flipEase(),
          direction: 'reverse',
          fill: 'both',
        });
        currentAnim.onfinish = finish;
      } else {
        flip.addEventListener('transitionend', function handler(e) {
          if (e.propertyName !== 'opacity') return;
          flip.removeEventListener('transitionend', handler);
          finish();
        });
        flip.classList.remove('is-open');
      }
    }

    function onKeydown(e) {
      if (e.key === 'Escape') closePanel();
    }

    document.querySelectorAll('.cert-card').forEach((card) => {
      card.addEventListener('click', () => openPanel(card));
    });
    closeBtn.addEventListener('click', closePanel);
    scrim.addEventListener('click', closePanel);
  }

  initCertPanels();
  document.addEventListener('astro:page-load', initCertPanels);
})();</script>
